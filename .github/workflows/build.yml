name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Restore
        run: dotnet restore AiPhoto.slnx

      - name: Build
        run: dotnet build AiPhoto.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test tests/AiPhoto.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      - name: Publish (single-file, self-contained)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/AiPhoto.App/AiPhoto.App.csproj -c Release -r $rid -o "publish/$rid" `
              -p:Version=${{ steps.version.outputs.version }}
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "AiPhoto-${{ steps.version.outputs.version }}-$rid.zip"
          }

      - name: Upload win-x64
        uses: actions/upload-artifact@v7
        with:
          name: AiPhoto-win-x64
          path: publish/win-x64

      - name: Upload win-arm64
        uses: actions/upload-artifact@v7
        with:
          name: AiPhoto-win-arm64
          path: publish/win-arm64

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: AiPhoto-*.zip
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
